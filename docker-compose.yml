services:
  signal-lab:
    # Built by .github/workflows/docker.yml. The server only pulls it, because
    # the build tools need AVX2, which the server's CPU doesn't have.
    image: ${SIGNAL_LAB_IMAGE:-ghcr.io/dootlord/signal-lab:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Scanner model: any OpenAI-compatible API. Defaults to OpenAI.
      SCAN_LLM_KEY: ${SCAN_LLM_KEY:-}
      SCAN_LLM_URL: ${SCAN_LLM_URL:-}
      SCAN_LLM_MODEL: ${SCAN_LLM_MODEL:-}
      SCAN_BATCH_SIZE: ${SCAN_BATCH_SIZE:-}
      SCAN_MAX_SUGGESTIONS: ${SCAN_MAX_SUGGESTIONS:-}
    volumes:
      - signal-lab-data:/app/data

volumes:
  signal-lab-data:
