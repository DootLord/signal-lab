services:
  signal-lab:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/signal-lab.sqlite
      AUTH_USER: ${AUTH_USER:?Set AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD}
      SCOUT_INGEST_TOKEN: ${SCOUT_INGEST_TOKEN:-}
      SCOUT_LLM_BASE_URL: ${SCOUT_LLM_BASE_URL:-}
      SCOUT_LLM_MODEL: ${SCOUT_LLM_MODEL:-}
      SCOUT_LLM_KEY: ${SCOUT_LLM_KEY:-}
      SCOUT_SITE_URL: http://127.0.0.1:3000
    volumes:
      - signal-lab-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  signal-lab-data:
